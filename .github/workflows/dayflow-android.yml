name: Build DayFlow Android
# Keep release builds independent from Pages publication retries.

on:
  push:
    paths:
      - "dayflow-android/**"
      - ".github/workflows/dayflow-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one build for a branch may publish artifacts/release assets at a time.
# New commits cancel older in-flight builds so a stale APK cannot overwrite latest.
concurrency:
  group: dayflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayflow-android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Prepare persistent signing key
        id: signing
        env:
          DAYFLOW_KEYSTORE_BASE64: ${{ secrets.DAYFLOW_KEYSTORE_BASE64 }}
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          if [ -n "$DAYFLOW_KEYSTORE_BASE64" ] && [ -n "$DAYFLOW_STORE_PASSWORD" ] && [ -n "$DAYFLOW_KEY_PASSWORD" ]; then
            mkdir -p app
            echo "$DAYFLOW_KEYSTORE_BASE64" | base64 --decode > app/dayflow-release.jks
            if [ ! -s app/dayflow-release.jks ]; then
              echo "::error::The release keystore secret decoded to an empty file."
              exit 1
            fi
            echo "DAYFLOW_SIGNED=true" >> "$GITHUB_ENV"
            echo "Persistent release signing is configured."
          elif [ -z "$DAYFLOW_KEYSTORE_BASE64" ] && [ -z "$DAYFLOW_STORE_PASSWORD" ] && [ -z "$DAYFLOW_KEY_PASSWORD" ]; then
            echo "DAYFLOW_SIGNED=false" >> "$GITHUB_ENV"
            echo "Persistent signing secrets are not configured; building a debug APK."
          else
            echo "::error::Signing secrets are partially configured. Add DAYFLOW_KEYSTORE_BASE64, DAYFLOW_STORE_PASSWORD, and DAYFLOW_KEY_PASSWORD together."
            exit 1
          fi

      - name: Validate widget RemoteViews layout
        run: python3 scripts/validate_widget_layout.py

      - name: Generate and validate offline PDF reading copies
        run: python3 scripts/generate_offline_plan_pdfs.py

      - name: Run attendance regression tests
        run: gradle :app:testDebugUnitTest

      - name: Verify offline PDF library in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            cd dayflow-android
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            gradle :app:connectedDebugAndroidTest

      - name: Verify persistent release key
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          keytool -list -keystore app/dayflow-release.jks -storepass "$DAYFLOW_STORE_PASSWORD" -alias "${DAYFLOW_KEY_ALIAS:-dayflow}" >/dev/null
          echo "Persistent release key is readable."

      - name: Build release APK
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: gradle :app:assembleRelease

      - name: Build debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        run: gradle :app:assembleDebug

      - name: Upload release APK
        if: env.DAYFLOW_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-release-apk
          path: dayflow-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish latest signed APK
        if: env.DAYFLOW_SIGNED == 'true' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "DayFlow latest" --notes "Latest stable DayFlow APK."
          cat > dayflow-android/update.json <<EOF
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "1.0.${GITHUB_RUN_NUMBER}",
            "releaseNotes": "Latest DayFlow Android build with bug fixes and improvements."
          }
          EOF
          gh release upload latest dayflow-android/app/build/outputs/apk/release/app-release.apk --clobber
          gh release upload latest dayflow-android/update.json --clobber

      - name: Upload debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-debug-apk
          path: dayflow-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
