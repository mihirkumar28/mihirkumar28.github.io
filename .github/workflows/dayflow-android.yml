name: Build DayFlow Android
# Keep release builds independent from Pages publication retries.

on:
  push:
    paths:
      - "dayflow-android/**"
      - ".github/workflows/dayflow-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dayflow-android/**"
      - ".github/workflows/dayflow-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Keep this concurrency namespace distinct from older hung emulator runs.
# New commits cancel stale builds so an older APK cannot overwrite latest.
concurrency:
  group: dayflow-android-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dayflow-android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Prepare persistent signing key
        id: signing
        env:
          DAYFLOW_KEYSTORE_BASE64: ${{ secrets.DAYFLOW_KEYSTORE_BASE64 }}
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          if [ -n "$DAYFLOW_KEYSTORE_BASE64" ] && [ -n "$DAYFLOW_STORE_PASSWORD" ] && [ -n "$DAYFLOW_KEY_PASSWORD" ]; then
            mkdir -p app
            echo "$DAYFLOW_KEYSTORE_BASE64" | base64 --decode > app/dayflow-release.jks
            if [ ! -s app/dayflow-release.jks ]; then
              echo "::error::The release keystore secret decoded to an empty file."
              exit 1
            fi
            echo "DAYFLOW_SIGNED=true" >> "$GITHUB_ENV"
            echo "Persistent release signing is configured."
          elif [ -z "$DAYFLOW_KEYSTORE_BASE64" ] && [ -z "$DAYFLOW_STORE_PASSWORD" ] && [ -z "$DAYFLOW_KEY_PASSWORD" ]; then
            echo "DAYFLOW_SIGNED=false" >> "$GITHUB_ENV"
            echo "Persistent signing secrets are not configured; building a debug APK."
          else
            echo "::error::Signing secrets are partially configured. Add DAYFLOW_KEYSTORE_BASE64, DAYFLOW_STORE_PASSWORD, and DAYFLOW_KEY_PASSWORD together."
            exit 1
          fi

      - name: Validate widget RemoteViews layout
        run: python3 scripts/validate_widget_layout.py

      - name: Package original PDFs when present; otherwise generate labelled offline copies
        run: python3 scripts/generate_offline_plan_pdfs.py

      - name: Validate roadmap catalog and packaged PDF archive
        run: python3 scripts/validate_plan_catalog.py

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest

      # Keep device verification on PR/manual runs; avoid a second slow emulator boot after merge.
      - name: Verify offline PDF library in Android emulator
        id: emulator_smoke
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          working-directory: dayflow-android
          script: |
            # Bound shell waits so a non-responsive activity cannot hold the build forever.
            gradle :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            timeout 45s adb shell am start -n com.mihirkumar.dayflow/.MainActivity
            sleep 8
            if ! adb shell dumpsys activity activities | grep -F 'MainActivity'; then
              echo "MainActivity was not present after launch. Recent Android logs:"
              adb logcat -d -t 400
              exit 1
            fi
            python3 - <<'PY'
            import io
            import zipfile
            from pathlib import Path
            apk = Path("app/build/outputs/apk/debug/app-debug.apk")
            with zipfile.ZipFile(apk) as package:
                names = set(package.namelist())
                assert "assets/plan_pdfs.zip" in names, "APK is missing the offline PDF archive"
                archive_bytes = package.read("assets/plan_pdfs.zip")
            with zipfile.ZipFile(io.BytesIO(archive_bytes)) as documents:
                assert documents.testzip() is None, "Offline PDF archive is corrupt inside the APK"
                pdfs = documents.namelist()
                assert pdfs, "Offline PDF archive is empty"
                for name in pdfs:
                    assert documents.read(name).startswith(b"%PDF-"), f"Invalid PDF: {name}"
            print(f"Offline asset verification passed: {len(pdfs)} PDF(s) embedded in {apk}.")
            PY

      - name: Verify persistent release key
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          keytool -list -keystore app/dayflow-release.jks -storepass "$DAYFLOW_STORE_PASSWORD" -alias "${DAYFLOW_KEY_ALIAS:-dayflow}" >/dev/null
          echo "Persistent release key is readable."

      - name: Build release APK
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: gradle :app:assembleRelease

      - name: Build debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        run: gradle :app:assembleDebug

      - name: Upload release APK
        if: env.DAYFLOW_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-release-apk
          path: dayflow-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Require original PDFs before stable publication
        id: original_pdf_gate
        if: env.DAYFLOW_SIGNED == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python3 scripts/validate_plan_catalog.py --require-originals

      - name: Publish latest signed APK
        if: env.DAYFLOW_SIGNED == 'true' && github.ref == 'refs/heads/main' && steps.original_pdf_gate.outcome == 'success' && (github.event_name != 'pull_request' && steps.emulator_smoke.outcome != 'failure')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "DayFlow latest" --notes "Latest stable DayFlow APK."
          cat > dayflow-android/update.json <<EOF
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "1.0.${GITHUB_RUN_NUMBER}",
            "releaseNotes": "Latest DayFlow Android build with bug fixes and improvements."
          }
          EOF
          gh release upload latest dayflow-android/app/build/outputs/apk/release/app-release.apk --clobber
          gh release upload latest dayflow-android/update.json --clobber

      - name: Upload debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-debug-apk
          path: dayflow-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
