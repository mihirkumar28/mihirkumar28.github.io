name: Build DayFlow Android
# Keep release builds independent from Pages publication retries.

on:
  push:
    paths:
      - "dayflow-android/**"
      - ".github/workflows/dayflow-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one build for a branch may publish artifacts/release assets at a time.
# New commits cancel older in-flight builds so a stale APK cannot overwrite latest.
concurrency:
  group: dayflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayflow-android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Prepare persistent signing key
        id: signing
        env:
          DAYFLOW_KEYSTORE_BASE64: ${{ secrets.DAYFLOW_KEYSTORE_BASE64 }}
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          if [ -n "$DAYFLOW_KEYSTORE_BASE64" ] && [ -n "$DAYFLOW_STORE_PASSWORD" ] && [ -n "$DAYFLOW_KEY_PASSWORD" ]; then
            mkdir -p app
            echo "$DAYFLOW_KEYSTORE_BASE64" | base64 --decode > app/dayflow-release.jks
            if [ ! -s app/dayflow-release.jks ]; then
              echo "::error::The release keystore secret decoded to an empty file."
              exit 1
            fi
            echo "DAYFLOW_SIGNED=true" >> "$GITHUB_ENV"
            echo "Persistent release signing is configured."
          elif [ -z "$DAYFLOW_KEYSTORE_BASE64" ] && [ -z "$DAYFLOW_STORE_PASSWORD" ] && [ -z "$DAYFLOW_KEY_PASSWORD" ]; then
            echo "DAYFLOW_SIGNED=false" >> "$GITHUB_ENV"
            echo "Persistent signing secrets are not configured; building a debug APK."
          else
            echo "::error::Signing secrets are partially configured. Add DAYFLOW_KEYSTORE_BASE64, DAYFLOW_STORE_PASSWORD, and DAYFLOW_KEY_PASSWORD together."
            exit 1
          fi

      - name: Validate widget RemoteViews layout
        run: python3 scripts/validate_widget_layout.py

      - name: Run attendance regression tests
        run: gradle :app:testDebugUnitTest

      - name: Verify persistent release key
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: |
          keytool -list -keystore app/dayflow-release.jks -storepass "$DAYFLOW_STORE_PASSWORD" -alias "${DAYFLOW_KEY_ALIAS:-dayflow}" >/dev/null
          echo "Persistent release key is readable."

      - name: Build release APK
        if: env.DAYFLOW_SIGNED == 'true'
        env:
          DAYFLOW_STORE_PASSWORD: ${{ secrets.DAYFLOW_STORE_PASSWORD }}
          DAYFLOW_KEY_PASSWORD: ${{ secrets.DAYFLOW_KEY_PASSWORD }}
          DAYFLOW_KEY_ALIAS: ${{ secrets.DAYFLOW_KEY_ALIAS }}
        run: gradle :app:assembleRelease

      - name: Generate and verify update metadata
        if: env.DAYFLOW_SIGNED == 'true'
        working-directory: .
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          repo = pathlib.Path.cwd()
          apk = repo / "dayflow-android/app/build/outputs/apk/release/app-release.apk"
          if not apk.is_file():
              raise SystemExit(f"::error::Release APK is missing: {apk}")

          sdk_candidates = [
              os.environ.get("ANDROID_HOME"),
              os.environ.get("ANDROID_SDK_ROOT"),
              "/usr/local/lib/android/sdk",
          ]
          sdk_roots = [pathlib.Path(p) for p in sdk_candidates if p]
          sdk = next((p for p in sdk_roots if (p / "build-tools").is_dir()), None)
          if sdk is None:
              raise SystemExit("::error::Android SDK build-tools directory was not found.")

          aapt_paths = [p for p in (sdk / "build-tools").glob("*/aapt") if p.is_file()]
          if not aapt_paths:
              raise SystemExit("::error::Android aapt tool was not found.")

          def version_key(path):
              return tuple(int(piece) for piece in re.findall(r"\d+", path.parent.name))

          aapt = max(aapt_paths, key=version_key)
          result = subprocess.run(
              [str(aapt), "dump", "badging", str(apk)],
              check=True, capture_output=True, text=True
          )
          package_line = next(
              (line for line in result.stdout.splitlines() if line.startswith("package:")),
              ""
          )
          package_name = re.search(r"name='([^']+)'", package_line)
          apk_code = re.search(r"versionCode='(\d+)'", package_line)
          apk_name = re.search(r"versionName='([^']+)'", package_line)
          if not package_name or not apk_code or not apk_name:
              raise SystemExit("::error::Could not read package/version metadata from the release APK.")
          if package_name.group(1) != "com.mihirkumar.dayflow":
              raise SystemExit("::error::Release APK has an unexpected package name.")

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          expected_code = run_number
          expected_name = f"1.0.{run_number}"
          actual_code = int(apk_code.group(1))
          actual_name = apk_name.group(1)
          if actual_code != expected_code or actual_name != expected_name:
              raise SystemExit(
                  f"::error::APK version mismatch: expected {expected_code}/{expected_name}, "
                  f"got {actual_code}/{actual_name}."
              )

          metadata_path = repo / "dayflow-android/update.json"
          metadata_path.write_text(json.dumps({
              "versionCode": expected_code,
              "versionName": expected_name,
              "releaseNotes": "Latest DayFlow Android build with bug fixes and improvements."
          }, indent=2) + "\n", encoding="utf-8")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("versionCode") != actual_code or metadata.get("versionName") != actual_name:
              raise SystemExit("::error::Update metadata does not match the APK version.")

          print(f"Verified release APK and update metadata: {actual_code}/{actual_name}")
          PY

      - name: Build debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        run: gradle :app:assembleDebug

      - name: Upload release APK
        if: env.DAYFLOW_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-release-apk
          path: dayflow-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish latest signed APK
        if: env.DAYFLOW_SIGNED == 'true' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "DayFlow latest" --notes "Latest stable DayFlow APK."
          gh release upload latest dayflow-android/app/build/outputs/apk/release/app-release.apk --clobber
          gh release upload latest dayflow-android/update.json --clobber

      - name: Upload debug APK
        if: env.DAYFLOW_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-debug-apk
          path: dayflow-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
