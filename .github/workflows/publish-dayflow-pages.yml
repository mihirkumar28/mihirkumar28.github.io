name: Publish public DayFlow downloads

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build DayFlow Android"]
    types: [completed]
    branches: [main]

# GitHub Pages permits only one active deployment at a time. Serialize this workflow
# so closely spaced Android builds cannot collide at the deploy step.
concurrency:
  group: dayflow-github-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download signed APK and prepare matching update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download latest \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern app-release.apk \
            --dir site
          test -s site/app-release.apk

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION_CODE="${{ github.event.workflow_run.run_number }}"
            cat > site/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "1.0.${VERSION_CODE}",
            "releaseNotes": "Latest DayFlow Android build with bug fixes and improvements. Offline plan documents are accurately labelled as originals or condensed copies according to the assets included."
          }
          EOF
          else
            gh release download latest \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern update.json \
              --dir site
          fi

          test -s site/update.json
          echo "Prepared matching APK and update metadata for public deployment."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # A unique name prevents reruns from seeing duplicate artifacts.
          name: dayflow-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy public download endpoint
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: dayflow-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish update metadata after matching APK is live
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release clients only see this new version after the Pages APK has deployed.
          gh release upload latest site/update.json --clobber
